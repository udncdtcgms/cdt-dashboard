<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fechamento de Novembro | Cartão de TODOS Campo Grande MS</title>
<style>
:root{--g9:#00513C;--g8:#007A5A;--g6:#00A078;--g1:#E6F9F3;--lime:#A0F000;--gold:#C8972B;--gold1:#FBF3E2;--red:#C0392B;--red1:#FBEAE8;--ink:#13221D;--mut:#5E6F68;--line:#E3EAE7;--bg:#F3F6F5;--tim:#0B3D91;--refu:#E8501E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Calibri,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(120deg,#003D2D 0%,var(--g8) 60%,var(--g6) 100%);color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--lime);display:grid;place-items:center;color:#003D2D;font-weight:900;font-size:15px;letter-spacing:-.5px}
.brand b{font-size:18px;display:block}.brand small{opacity:.8;font-size:12.5px}
.stamp{font-size:12.5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 12px;border-radius:999px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav button{background:none;border:0;color:rgba(255,255,255,.75);font:inherit;font-weight:700;font-size:14px;padding:12px 16px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--g8)}
main{padding:22px 0 40px}
.sec{margin-top:26px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sh h2{font-size:19px;letter-spacing:-.2px}.sh p{color:var(--mut);font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.t-ok{background:var(--g1);color:var(--g8)}.t-warn{background:var(--gold1);color:#8A6414}.t-bad{background:var(--red1);color:var(--red)}.t-neu{background:#EEF2F0;color:var(--mut)}
.bar{height:10px;background:#EAF0EE;border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:12.5px;flex:none;font-style:normal}
.mut{color:var(--mut)}
/* HERO countdown */
.hero{background:radial-gradient(circle at 85% 0%,rgba(160,240,0,.18),transparent 40%),linear-gradient(135deg,#0B1F19,#063A2C 55%,#00553F);color:#fff;border-radius:20px;padding:24px;position:relative;overflow:hidden}
.hero .k{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--lime);font-weight:800}
.hero h1{font-size:30px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.5px}
.hero .sub{opacity:.8;font-size:13.5px}
.hrow{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:center}
.clock{display:flex;gap:10px;margin-top:18px}
.clock div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 6px;text-align:center;flex:1;min-width:0}
.clock b{display:block;font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1}
.clock span{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.75}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tl{background:#fff;color:var(--ink);border-radius:14px;padding:14px}
.tl b{font-size:30px;display:block;line-height:1;color:var(--g8)}
.tl span{font-size:12.5px;color:var(--mut)}
.tl.hot{background:var(--lime)}.tl.hot b{color:#0B1F19}.tl.hot span{color:#28402F}
/* unit meta */
.umeta{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.big{font-size:54px;font-weight:900;letter-spacing:-2px;line-height:1;color:var(--g8)}
.big small{font-size:22px;color:var(--mut);letter-spacing:0;font-weight:700}
.prog{height:22px;background:#EAF0EE;border-radius:99px;position:relative;margin:26px 0 8px;overflow:visible}
.prog .f{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--g8),var(--g6))}
.prog .p{position:absolute;top:0;bottom:0;border-radius:99px;background:repeating-linear-gradient(45deg,rgba(0,160,120,.25) 0 6px,rgba(0,160,120,.12) 6px 12px)}
.prog .m{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink);border-radius:2px}
.prog .m em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;font-style:normal;font-weight:700;white-space:nowrap}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.kp div{background:var(--bg);border-radius:12px;padding:10px 12px}
.kp b{font-size:20px;display:block}.kp span{font-size:12px;color:var(--mut)}
.need{background:linear-gradient(135deg,#C0392B,#E0533F);color:#fff;border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:center}
.need .n{font-size:64px;font-weight:900;line-height:1;letter-spacing:-2px}
.need p{opacity:.92}
.need.ok{background:linear-gradient(135deg,var(--g8),var(--g6))}
/* seller day goals */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;border-top:5px solid var(--c);display:flex;flex-direction:column;gap:10px}
.sc .hd{display:flex;align-items:center;gap:10px}
.sc .hd b{font-size:15px}.sc .hd small{display:block;color:var(--mut);font-size:11.5px}
.dn{display:flex;align-items:baseline;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px}
.dn b{font-size:44px;line-height:1;font-weight:900;letter-spacing:-1.5px}
.dn span{font-size:12.5px;color:var(--mut);line-height:1.25}
.dn.bad b{color:var(--red)}.dn.warn b{color:var(--gold)}.dn.ok b{color:var(--g8)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.row3 div{border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.row3 b{display:block;font-size:16px}.row3 span{font-size:10.5px;color:var(--mut)}
.sc .bn{font-size:12px;color:var(--mut);border-top:1px dashed var(--line);padding-top:8px}
.sum{display:flex;align-items:center;gap:16px;background:#0B1F19;color:#fff;border-radius:16px;padding:16px 20px;margin-top:12px;flex-wrap:wrap}
.sum .n{font-size:40px;font-weight:900;color:var(--lime);line-height:1}
.sum p{flex:1;min-width:220px;opacity:.9}
/* metas unidade */
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mc .lbl{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.mc .vv{display:flex;align-items:baseline;gap:6px;margin:6px 0 10px}
.mc .vv b{font-size:30px;letter-spacing:-.5px}.mc .vv span{color:var(--mut)}
.mc .ft{display:flex;justify-content:space-between;font-size:12.5px;margin-top:8px;gap:8px}
/* offers */
.of{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ofc{border-radius:20px;padding:22px;color:#fff;position:relative;overflow:hidden}
.ofc.tim{background:radial-gradient(circle at 100% 0%,rgba(255,255,255,.15),transparent 45%),linear-gradient(140deg,#071E4A,var(--tim) 70%,#1556C8)}
.ofc.refu{background:radial-gradient(circle at 100% 0%,rgba(247,148,29,.35),transparent 45%),linear-gradient(140deg,#2A1410,#4A1E12 50%,#1E3A30)}
.ofc .selo{display:inline-block;background:#fff;color:var(--tim);font-weight:800;font-size:11.5px;padding:5px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.6px}
.ofc.refu .selo{background:var(--refu);color:#fff}
.ofc h3{font-size:26px;margin:10px 0 2px;letter-spacing:-.4px}
.ofc .ch{opacity:.85;font-size:13.5px}
.price{display:flex;align-items:flex-end;gap:8px;margin:16px 0}
.price .rs{font-size:18px;font-weight:700;margin-bottom:8px}
.price .vl{font-size:58px;font-weight:900;line-height:.9;letter-spacing:-2px}
.price .ob{font-size:12.5px;opacity:.85;margin-bottom:6px;max-width:140px}
.pr2{display:flex;gap:10px;margin:16px 0}
.pr2 div{background:var(--refu);border-radius:14px;padding:10px 14px;border:2px solid rgba(255,255,255,.85)}
.pr2 div:nth-child(2){background:#F7941D}
.pr2 small{display:block;font-size:11px;font-weight:800;text-transform:uppercase}
.pr2 b{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1}
.bens{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bens div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 11px}
.bens b{display:block;font-size:15px}.bens span{font-size:12px;opacity:.82}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pl div{background:#fff;color:var(--ink);border-radius:12px;padding:9px 11px}
.pl b{display:block}.pl span{font-size:12px;color:var(--mut)}
.ofmeta{margin-top:16px;background:rgba(0,0,0,.25);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.ofmeta b{display:block;font-size:22px}.ofmeta span{font-size:11.5px;opacity:.8}
.rg{font-size:12px;opacity:.8;margin-top:10px}
.rg a{color:#fff}
/* race & charts */
.lane{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lane:last-child{border:0}
.lane .nm{display:flex;align-items:center;gap:8px;font-weight:700}
.track{height:14px;background:#EEF2F0;border-radius:99px;position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.track .pj{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px;opacity:.55}
.alert{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.alert:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;padding:9px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tw{overflow-x:auto}
.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--g8);font-weight:700}.dw{color:var(--red);font-weight:700}
.sel{display:flex;gap:8px;flex-wrap:wrap}
.sel button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--mut)}
.sel button.on{background:var(--g8);border-color:var(--g8);color:#fff}
.vc{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.qq{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.qq>div{background:var(--bg);border-radius:12px;padding:10px}
.qq h4{font-size:12px;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.ln{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:3px 0}
.g2{grid-template-columns:1.5fr 1fr}@media(max-width:900px){.g2{grid-template-columns:1fr}}
.foot{color:var(--mut);font-size:12px;margin-top:28px;line-height:1.6}
@media(max-width:1100px){.sg{grid-template-columns:repeat(3,1fr)}.vc{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.hrow,.umeta,.of{grid-template-columns:1fr}.mg{grid-template-columns:1fr 1fr}.sg{grid-template-columns:1fr 1fr}.kp{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.wrap{padding:0 12px}.hero h1{font-size:24px}.clock b{font-size:30px}.sg,.mg,.vc{grid-template-columns:1fr}.lane{grid-template-columns:110px 1fr;}.lane .rt{grid-column:1/-1}.big{font-size:44px}.need .n{font-size:52px}.bens,.pl{grid-template-columns:1fr}.price .vl{font-size:48px}}
/* faixas de meta */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tier{border-radius:14px;padding:12px 14px;border:2px solid var(--line);background:#fff;position:relative}
.tier .tn{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--mut)}
.tier .tv{font-size:26px;font-weight:900;letter-spacing:-.8px;line-height:1.1}
.tier .tv small{font-size:13px;color:var(--mut);font-weight:700;letter-spacing:0}
.tier .tf{font-size:12.5px;margin-top:6px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.tier.cur{border-color:var(--g6);box-shadow:0 6px 18px rgba(0,160,120,.15)}
.tier.done{background:var(--g1);border-color:var(--g6)}
.tier .bar{height:7px;margin-top:8px}
.prog .tk{position:absolute;top:-6px;bottom:-6px;width:2px;background:rgba(19,34,29,.55)}
.prog .tk em{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-size:10.5px;font-style:normal;font-weight:800;white-space:nowrap;color:var(--ink)}
.prog .tk.last em{left:auto;right:0;transform:none}
.prog .tk.up em{top:-20px}
.nl{margin-top:12px;border-top:1px solid rgba(255,255,255,.3);padding-top:10px;display:grid;gap:5px;font-size:13px}
.nl div{display:flex;justify-content:space-between;gap:8px}
/* metas coletivas */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cgc{border-radius:20px;padding:20px 22px;color:#fff;position:relative;overflow:hidden}
.cgc.tim{background:radial-gradient(circle at 100% 0%,rgba(255,255,255,.14),transparent 45%),linear-gradient(140deg,#0B3D91,#1556C8)}
.cgc.refu{background:radial-gradient(circle at 100% 0%,rgba(255,255,255,.16),transparent 45%),linear-gradient(140deg,#D4421A,#F06A2A)}
.cgc .lb{font-size:13px;font-weight:800;opacity:.95}
.cgc .nm{font-size:68px;font-weight:900;letter-spacing:-3px;line-height:1;margin-top:8px}
.cgc .nm small{font-size:26px;letter-spacing:-.5px;opacity:.9;margin-left:6px}
.cgc .pl{display:inline-block;background:var(--lime);color:#13221D;font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;margin-top:10px}
.cgc .tr{height:12px;background:rgba(255,255,255,.25);border-radius:99px;margin:18px 0 12px;overflow:hidden}
.cgc .tr i{display:block;height:100%;background:#fff;border-radius:99px}
.cgc .bx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cgc .bx div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.cgc .bx b{display:block;font-size:22px;font-weight:900}.cgc .bx span{font-size:11.5px;opacity:.9}
@media(max-width:900px){.cg,.tiers{grid-template-columns:1fr}}
/* alertas piscando */
@keyframes pR{0%,100%{opacity:1}50%{opacity:.18}}
@keyframes pA{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes gR{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}50%{box-shadow:0 0 0 5px rgba(192,57,43,.45),0 0 22px rgba(192,57,43,.35)}}
@keyframes gA{0%,100%{box-shadow:0 0 0 0 rgba(200,151,43,0)}50%{box-shadow:0 0 0 4px rgba(200,151,43,.38)}}
@keyframes bgR{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25) saturate(1.2)}}
body:not(.quieto) .b-bad,body:not(.quieto) .tag.t-bad,body:not(.quieto) .dn.bad b,body:not(.quieto) .dot.d-bad{animation:pR .9s ease-in-out infinite}
body:not(.quieto) .b-warn,body:not(.quieto) .tag.t-warn,body:not(.quieto) .dn.warn b,body:not(.quieto) .dot.d-warn{animation:pA 1.8s ease-in-out infinite}
body:not(.quieto) .sc.st-bad,body:not(.quieto) .card.st-bad,body:not(.quieto) .tier.st-bad{animation:gR 1.2s ease-in-out infinite}
body:not(.quieto) .sc.st-warn,body:not(.quieto) .card.st-warn,body:not(.quieto) .tier.st-warn{animation:gA 2.2s ease-in-out infinite}
body:not(.quieto) .need:not(.ok),body:not(.quieto) .astrip.has-bad{animation:bgR 1.1s ease-in-out infinite}
.sc.st-bad,.card.st-bad{border-color:var(--red)}.sc.st-warn,.card.st-warn{border-color:var(--gold)}
.blink-btn{font:inherit;font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);padding:7px 12px;border-radius:999px;cursor:pointer}
.blink-btn[aria-pressed="true"]{background:var(--lime);color:#003D2D;border-color:var(--lime)}
.topr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.astrip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:16px;padding:14px 18px;margin-top:14px;background:linear-gradient(135deg,#C0392B,#E0533F);color:#fff;cursor:pointer;border:0;width:100%;text-align:left;font:inherit}
.astrip.only-warn{background:linear-gradient(135deg,#A9791C,#C8972B)}
.astrip.none{background:linear-gradient(135deg,var(--g8),var(--g6));cursor:default}
.astrip .n{font-size:34px;font-weight:900;line-height:1}
.astrip .tx{flex:1;min-width:200px}.astrip .tx b{display:block;font-size:15px}.astrip .tx span{font-size:12.5px;opacity:.92}
.astrip .ch{display:flex;gap:6px;flex-wrap:wrap}.astrip .ch span{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.legend-blink{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend-blink span{display:flex;gap:6px;align-items:center}
@media print{*{animation:none!important}.blink-btn{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><div class="logo">CDT</div><div><b>Cartão de TODOS · Campo Grande MS</b><small>Painel do time de vendas</small></div></div>
      <div class="topr"><button type="button" class="blink-btn" id="blink" aria-pressed="false">⏸ Pausar alertas piscando</button><div class="stamp" id="stamp"></div></div>
    </div>
    <nav id="nav">
      <button data-v="fech" class="on">Fechamento</button>
      <button data-v="vend">Vendedores</button>
      <button data-v="cart">Carteira Pendente</button>
      <button data-v="comp">Comparativo</button>
    </nav>
  </div>
</header>

   <div class="ck"><span class="dot" style="background:${COL[s.mes.v>=s.alvo?'ok':'neu']};margin-top:4px"></span><span>Bonificação: ${s.mes.v} de ${s.alvo} vendas</span></div>
   <div class="ck"><span class="dot" style="background:${COL.neu};margin-top:4px"></span><span>TIM Controle e Refuturiza individuais: a lançar</span></div>
   <div class="ck"><span class="dot" style="background:${COL[s.pend.length?'warn':'ok']};margin-top:4px"></span><span>Carteira pendente: <b>${s.pend.length}</b> cliente${s.pend.length===1?'':'s'}</span></div></div>
  </div>`}).join('')}</div>${foot()}`;
}
/* ---------- carteira ---------- */
let CF={s:'all',p:'q2'};
function vCart(){
  const PR={AMBOS:['bad','APP + PL pendentes',0],APP:['warn','Só APP pendente',1],PL:['neu2','Só PL pendente',2]};
  const dc={bad:'#C0392B',warn:'#C8972B',neu2:'#E5C24A'};
  const list=S.filter(s=>CF.s==='all'||CF.s===s.nome).map(s=>({s,c:s.pend.filter(x=>CF.p==='mes'||x.dd>=16).sort((a,b)=>PR[a.k][2]-PR[b.k][2]||a.dd-b.dd)})).filter(x=>x.c.length);
  const tot=list.reduce((a,x)=>a+x.c.length,0);
  return `<div class="sh"><div><h2>Carteira Pendente</h2><p>Clientes sem APP e/ou sem PL ativa. Prioridade de cima para baixo. ${tot} cliente${tot===1?'':'s'} na seleção.</p></div>
   <div class="sel"><button data-cp="q2" class="${CF.p==='q2'?'on':''}">2ª quinzena</button><button data-cp="mes" class="${CF.p==='mes'?'on':''}">Mês inteiro</button></div></div>
   <div class="sel" style="margin-bottom:14px"><button data-cs="all" class="${CF.s==='all'?'on':''}">Todos</button>${S.map(s=>`<button data-cs="${esc(s.nome)}" class="${CF.s===s.nome?'on':''}">${esc(s.nome)} (${s.pend.filter(x=>CF.p==='mes'||x.dd>=16).length})</button>`).join('')}</div>
   <div class="sel" style="margin-bottom:14px;gap:16px">${Object.values(PR).map(([k,l])=>`<span style="font-size:12.5px;display:flex;gap:6px;align-items:center"><span class="dot" style="background:${dc[k]};margin:0"></span>${l}</span>`).join('')}</div>
   <div class="grid">${list.map(({s,c})=>`<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><i class="av" style="background:${s.c}">${ini(s.nome)}</i><b style="font-size:15px">${esc(s.nome)}</b><span class="tag t-neu">${c.length} cliente${c.length===1?'':'s'}</span></div>
     <div class="tw"><table><thead><tr><th></th><th>Cliente</th><th>Venda</th><th>Telefone</th><th>Pendente</th><th class="num">QYC</th></tr></thead><tbody>
     ${c.map(x=>`<tr><td><span class="dot ${x.k==='AMBOS'?'d-bad':''}" style="background:${dc[PR[x.k][0]]};display:inline-block;margin:0"></span></td><td>${esc(x.n)}</td><td>${x.d}</td><td><a href="https://wa.me/55${x.t.replace(/\D/g,'')}" target="_blank" rel="noopener" style="color:var(--g8)">${x.t}</a></td><td><b>${x.k==='AMBOS'?'APP + PL':x.k}</b></td><td class="num" style="color:${COL[lv(x.q,75)]}">${x.q}%</td></tr>`).join('')}
     </tbody></table></div></div>`).join('')||'<div class="card mut">Nenhum cliente pendente nessa seleção.</div>'}</div>${foot()}`;
}
/* ---------- comparativo ---------- */
function vComp(){
  const dl=(a,b,d=1,u='')=>a==null||b==null?'<span class="mut">-</span>':(()=>{const x=b-a;return `<span class="${x>=0?'up':'dw'}">${x>=0?'▲':'▼'} ${fmt(Math.abs(x),d)}${u}</span>`})();
  const cell=(v,ref)=>v==null?'<span class="mut">-</span>':`<span class="b-${lv(v,ref)}" style="color:${COL[lv(v,ref)]};font-weight:700">${pct(v,0)}</span>`;
  const sum=k=>S.reduce((a,s)=>a+(s[k].v||0),0);
  return `<div class="sh"><div><h2>Comparativo 1ª x 2ª quinzena</h2><p>Variação da 2ª quinzena em relação à 1ª. Vendedores que entraram em 16/11 aparecem só na 2ª.</p></div></div>
  <div class="card tw"><table><thead><tr><th>Vendedor</th><th class="num">Vendas Q1</th><th class="num">Vendas Q2</th><th class="num">Δ</th><th class="num">APP Q1</th><th class="num">APP Q2</th><th class="num">Δ</th><th class="num">PL Q1</th><th class="num">PL Q2</th><th class="num">Δ</th><th class="num">QYC Q1</th><th class="num">QYC Q2</th><th class="num">Δ</th><th class="num">Mês</th></tr></thead><tbody>
  ${S.map(s=>`<tr><td><b>${esc(s.nome)}</b>${s.ferias?' <span class="tag t-neu">férias</span>':''}</td><td class="num">${s.q1.v??'-'}</td><td class="num">${s.q2.v}</td><td class="num">${dl(s.q1.v,s.q2.v,0)}</td>
   <td class="num">${cell(s.q1.app,75)}</td><td class="num">${cell(s.q2.app,75)}</td><td class="num">${dl(s.q1.app,s.q2.app,1,' p.p.')}</td>
   <td class="num">${cell(s.q1.pl,50)}</td><td class="num">${cell(s.q2.pl,50)}</td><td class="num">${dl(s.q1.pl,s.q2.pl,1,' p.p.')}</td>
   <td class="num">${cell(s.q1.qyc,75)}</td><td class="num">${cell(s.q2.qyc,75)}</td><td class="num">${dl(s.q1.qyc,s.q2.qyc,1,' p.p.')}</td><td class="num"><b>${s.mes.v}</b></td></tr>`).join('')}
  <tr style="background:var(--bg)"><td><b>Time</b></td><td class="num"><b>${sum('q1')}</b></td><td class="num"><b>${sum('q2')}</b></td><td></td><td colspan="9"></td><td class="num"><b>${sum('mes')}</b></td></tr>
  </tbody></table></div>
  <p class="mut" style="font-size:12px;margin-top:8px">A 2ª quinzena ainda está em andamento (dados até ${D.atualizado}).</p>${foot()}`;
}
function foot(){return `<div class="foot">Fonte: Vendas realizadas (filiados) para indicadores individuais, Produtividade para o total da unidade e Cashback gerado do mês. Metas da unidade: ${D.metas.map((m,i)=>`Meta ${String(i+1).padStart(2,'0')} = ${fmt(m)}`).join(', ')} vendas. Dados filtrados para a franquia Campo Grande. TIM Controle: meta de ${D.tim.meta_unid} no mês. Refuturiza: meta de ${D.refu.meta_unid} no mês. Dias úteis: segunda a sexta, sem os feriados de 02/11 e 20/11. Gerado em ${D.gerado}.</div>`}

/* ---------- app ---------- */
let V='fech';
const VIEWS={fech:vFech,vend:vVend,cart:vCart,comp:vComp};
function render(){document.getElementById('app').innerHTML=VIEWS[V]();tick();}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;V=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();window.scrollTo(0,0)});
document.getElementById('blink').addEventListener('click',e=>{const q=!document.body.classList.contains('quieto');document.body.classList.toggle('quieto',q);e.currentTarget.setAttribute('aria-pressed',q?'true':'false');e.currentTarget.textContent=q?'▶ Ligar alertas piscando':'⏸ Pausar alertas piscando'});
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.goto){const t=document.getElementById(b.dataset.goto);if(t)t.scrollIntoView({behavior:'smooth',block:'center'});return;}if(b.dataset.cs){CF.s=b.dataset.cs;render()}if(b.dataset.cp){CF.p=b.dataset.cp;render()}});
document.getElementById('stamp').textContent=`Vendas até ${D.atualizado} · metas ${D.metas.map(m=>fmt(m)).join(' / ')}`;
const pad=n=>String(n).padStart(2,'0');
function tick(){
  const now=new Date(),ms=Math.max(0,closeAt-now),s=Math.floor(ms/1000);
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
  set('cd-d',Math.floor(s/86400));set('cd-h',pad(Math.floor(s%86400/3600)));set('cd-m',pad(Math.floor(s%3600/60)));set('cd-s',pad(s%60));
  set('cd-hx',fmt(cal(now).hx,0)+'h');
}
render();setInterval(tick,1000);
let lastDay=new Date().getDate();setInterval(()=>{const d=new Date();if(d.getDate()!==lastDay||(d.getHours()===18&&d.getMinutes()===0&&d.getSeconds()<2)){lastDay=d.getDate();render()}},1000);
</script>
</body>
