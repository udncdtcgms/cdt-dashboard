<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Vendas CDT Campo Grande · Novembro/2026</title>
<style>
:root{--g9:#004D39;--g7:#007A5A;--g5:#00A078;--g1:#E6F9F3;--lime:#A0F000;--gold:#C8972B;--goldl:#FBF3E2;--red:#C0392B;--redl:#FBEAE8;
--ink:#14231E;--mut:#62716B;--line:#E3EAE7;--bg:#F3F6F5;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Calibri,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
header{background:linear-gradient(120deg,var(--g9),var(--g7) 70%);color:#fff;padding:26px 32px 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.brand small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.brand h1{font-size:26px;font-weight:700;margin-top:4px}
.stamp{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;font-size:12.5px}
.chip b{color:var(--lime)}
nav{max-width:1280px;margin:22px auto 0;display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;color:rgba(255,255,255,.75);font:inherit;font-weight:700;font-size:14px;padding:12px 18px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}
nav button:hover{color:#fff}
nav button.on{background:var(--bg);color:var(--g7)}
main{max-width:1280px;margin:0 auto;padding:24px 32px 48px}
.view{display:none}.view.on{display:block}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.mt{margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h2{font-size:15px;font-weight:700}
.card .lead{color:var(--mut);font-size:12.5px;margin-top:2px}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:0;padding:0;overflow:hidden}
.hero .main{padding:24px}
.hero .side{background:var(--g1);padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:center}
.big{font-size:52px;font-weight:700;line-height:1;margin-top:10px;color:var(--g9)}
.big small{font-size:20px;color:var(--mut);font-weight:400}
.track{position:relative;height:16px;background:#EDF2F0;border-radius:999px;margin-top:18px;overflow:visible}
.track .r{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--g7),var(--g5));border-radius:999px}
.track .p{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(45deg,#C9E9DD 0 6px,#DDF2EA 6px 12px);border-radius:999px}
.track .ideal{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--gold)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.st b{display:block;font-size:24px;font-weight:700;color:var(--g9)}
.st span{font-size:12px;color:var(--mut)}
.ok{color:var(--g7)!important}.warn{color:var(--gold)!important}.bad{color:var(--red)!important}
.gauge{display:flex;flex-direction:column;align-items:center;text-align:center}
.gauge .t{font-weight:700;margin-top:6px}
.gauge .s{font-size:12px;color:var(--mut)}
.pend{border:1.5px dashed #C9D3CF;background:repeating-linear-gradient(135deg,#fff 0 10px,#F7F9F8 10px 20px);display:flex;gap:16px;align-items:center}
.pend .ic{width:48px;height:48px;border-radius:12px;background:#EEF2F0;display:grid;place-items:center;flex:none}
.pend h3{font-size:16px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.t-ok{background:var(--g1);color:var(--g7)}.t-warn{background:var(--goldl);color:#8C6519}.t-bad{background:var(--redl);color:var(--red)}.t-neu{background:#EEF2F0;color:var(--mut)}
.rank{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.rk{display:grid;grid-template-columns:22px 110px 1fr 92px;align-items:center;gap:12px}
.rk .pos{font-weight:700;color:var(--mut);text-align:right}
.rk .nm{font-weight:700}
.rk .bar{position:relative;height:22px;background:#F1F5F3;border-radius:6px}
.rk .bar .pj{position:absolute;inset:0 auto 0 0;background:#D5EEE5;border-radius:6px}
.rk .bar .rv{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--g7),var(--g5));border-radius:6px}
.rk .bar .goal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold)}
.rk .vl{font-size:12.5px;color:var(--mut);text-align:right}
.rk .vl b{font-size:16px;color:var(--ink)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:10px;border-bottom:1px solid var(--line)}
.hm td.c{text-align:center;font-weight:700}
.cell{display:inline-block;min-width:62px;padding:6px 8px;border-radius:8px}
.note{font-size:12px;color:var(--mut);margin-top:12px}
.sc{display:flex;flex-direction:column;gap:14px}
.sc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sc h3{font-size:18px}
.sc .sub{font-size:12px;color:var(--mut)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--bg);border-radius:10px;padding:10px 12px}
.kv small{display:block;font-size:11.5px;color:var(--mut)}
.kv b{font-size:18px}
.minibar{height:8px;background:#EDF2F0;border-radius:999px;overflow:hidden;margin-top:6px}
.minibar i{display:block;height:100%;background:var(--g5);border-radius:999px}
details.cp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
details.cp summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
details.cp summary::-webkit-details-marker{display:none}
details.cp summary h3{font-size:16px}
details.cp[open] summary{border-bottom:1px solid var(--line)}
.cpw{padding:4px 20px 16px;overflow-x:auto}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.d-a{background:var(--red)}.d-b{background:var(--gold)}.d-c{background:#E5C77A}
.delta{font-weight:700}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--bg);margin-top:10px}
.alert .bdg{flex:none;width:6px;align-self:stretch;border-radius:4px}
.alert b{display:block}
.alert span{font-size:12.5px;color:var(--mut)}
.chart text{font-family:Calibri,Arial,sans-serif}

/* cor e profundidade */
body{background:radial-gradient(1200px 500px at 90% -10%,#D9F5EA 0,transparent 60%),var(--bg)}
header{position:relative;overflow:hidden}
header:before,header:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
header:before{width:420px;height:420px;right:-120px;top:-220px;background:radial-gradient(circle,rgba(160,240,0,.28),transparent 65%)}
header:after{width:300px;height:300px;left:30%;top:-200px;background:radial-gradient(circle,rgba(0,160,120,.55),transparent 70%)}
.top,nav{position:relative;z-index:1}
.card{box-shadow:0 1px 2px rgba(0,61,45,.04),0 8px 24px -12px rgba(0,61,45,.12)}
.hero{background:linear-gradient(135deg,#00382A 0%,#006B4F 55%,#00A078 100%);border:0;color:#fff;position:relative}
.hero:after{content:"";position:absolute;right:-80px;bottom:-120px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(160,240,0,.22),transparent 65%);pointer-events:none}
.hero .lbl{color:rgba(255,255,255,.7)}
.hero .big{color:#fff}.hero .big small{color:rgba(255,255,255,.65)}
.hero .track{background:rgba(255,255,255,.14)}
.hero .track .r{background:linear-gradient(90deg,#A0F000,#5EE0A8)}
.hero .track .p{background:repeating-linear-gradient(45deg,rgba(160,240,0,.35) 0 6px,rgba(160,240,0,.15) 6px 12px)}
.hero .track .ideal{background:#FFD36E}
.hero .legend{color:rgba(255,255,255,.8)}
.hero .side{background:rgba(255,255,255,.08);backdrop-filter:blur(2px);border-left:1px solid rgba(255,255,255,.12);z-index:1}
.hero .st b{color:#fff}.hero .st span{color:rgba(255,255,255,.7)}
.hero .st b.bad{color:#FFB4A8!important}.hero .st b.ok{color:#A0F000!important}
.gcard{position:relative;overflow:hidden}
.gcard:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--acc)}
.gcard{background:linear-gradient(180deg,var(--tint) 0,#fff 55%)}
/* corrida */
.race{background:linear-gradient(160deg,#0B2A22 0%,#0F3D30 60%,#145040 100%);border:0;color:#fff;padding:24px 24px 18px;position:relative;overflow:hidden}
.race:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 240px at 100% 0,rgba(200,151,43,.28),transparent 60%),radial-gradient(500px 220px at 0 100%,rgba(160,240,0,.12),transparent 60%);pointer-events:none}
.race>*{position:relative}
.race .rh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.race h2{font-size:22px;color:#fff}
.race .lead{color:rgba(255,255,255,.7)}
.prize{background:linear-gradient(135deg,#F3D27A,#C8972B);color:#3A2A05;border-radius:14px;padding:10px 18px;text-align:right;box-shadow:0 8px 24px -8px rgba(200,151,43,.7)}
.prize small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.8}
.prize b{font-size:26px}
.lanes{margin-top:22px;position:relative}
.scale{display:grid;grid-template-columns:150px 1fr 120px;gap:14px;font-size:11px;color:rgba(255,255,255,.55);margin-bottom:6px}
.scale .sx{position:relative;height:14px}
.scale .sx span{position:absolute;transform:translateX(-50%)}
.lane{display:grid;grid-template-columns:150px 1fr 120px;gap:14px;align-items:center;padding:9px 0;border-top:1px dashed rgba(255,255,255,.12)}
.lane .who{display:flex;align-items:center;gap:10px;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.lane .who small{display:block;font-size:11px;font-weight:400;color:rgba(255,255,255,.6)}
.road{position:relative;height:34px;border-radius:999px;background:rgba(255,255,255,.07)}
.road .ms{position:absolute;top:6px;bottom:6px;width:1px;background:rgba(255,255,255,.14)}
.road .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;opacity:.9}
.road .ghost{position:absolute;left:0;top:8px;bottom:8px;border-radius:999px;border:1.5px dashed}
.road .runner{position:absolute;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;border:3px solid #fff;box-shadow:0 6px 16px -4px rgba(0,0,0,.5);z-index:2}
.road .pjm{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;border:2.5px solid;background:#0F3D30;z-index:1}
.finish{position:absolute;top:-8px;bottom:-8px;width:12px;transform:translateX(-50%);background:repeating-conic-gradient(#fff 0 25%,#14231E 0 50%) 0 0/8px 8px;border-radius:2px;z-index:3;opacity:.9}
.lane .res{text-align:right;font-size:12px;color:rgba(255,255,255,.65)}
.lane .res b{font-size:22px;color:#fff}
.lane .res .st2{display:inline-block;margin-top:2px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.race .rl{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:rgba(255,255,255,.7)}
.race .rl i{display:inline-block;vertical-align:-2px;margin-right:6px}
.req{margin-top:16px}
.req table td,.req table th{text-align:center}
.req table td:first-child,.req table th:first-child{text-align:left}
.ck{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-weight:700;font-size:13px}
.ck.y{background:#E6F9F3;color:#007A5A}.ck.n{background:#FBEAE8;color:#C0392B}.ck.w{background:#EEF2F0;color:#9AA8A2}.ck.p{background:#FBF3E2;color:#8C6519}
.sc{border-top:5px solid var(--sc)}
.sc .avs{display:flex;align-items:center;gap:12px}
@media(max-width:640px){.lane,.scale{grid-template-columns:96px 1fr 64px;gap:8px}.lane .who small{display:none}.av{width:28px;height:28px;font-size:11px}.road .runner{width:32px;height:32px;font-size:12px}.lane .res b{font-size:17px}.lane .res .st2{display:none}.prize b{font-size:20px}}
/* esquenta black refu */
.blk{position:relative;overflow:hidden;border:0;padding:0;background:#0A0A0A;color:#fff}
.blk:before{content:"";position:absolute;inset:0;background:radial-gradient(520px 260px at 92% 10%,rgba(200,151,43,.45),transparent 60%),radial-gradient(420px 240px at 0 110%,rgba(160,240,0,.22),transparent 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 14px,transparent 14px 28px);pointer-events:none}
.blk>*{position:relative}
.blk .in{display:grid;grid-template-columns:1.4fr 1fr;gap:0}
.blk .l{padding:26px 28px}
.blk .r{padding:26px 28px;border-left:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;justify-content:center;gap:14px}
.blk .kick{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#0A0A0A;background:linear-gradient(135deg,#F3D27A,#C8972B);padding:5px 12px;border-radius:999px}
.blk .kick i{width:8px;height:8px;border-radius:50%;background:#0A0A0A;animation:pls 1.2s infinite}
@keyframes pls{50%{opacity:.25}}
.blk h2{font-size:34px;line-height:1.05;margin-top:14px;letter-spacing:-.01em;color:#fff}
.blk h2 span{color:#F3D27A}
.blk p{color:rgba(255,255,255,.72);margin-top:8px;font-size:14px}
.blk .goal{display:flex;align-items:baseline;gap:12px;margin-top:16px}
.blk .goal b{font-size:76px;line-height:.9;font-weight:700;background:linear-gradient(180deg,#FFFFFF,#F3D27A);-webkit-background-clip:text;background-clip:text;color:transparent}
.blk .goal span{font-size:18px;font-weight:700;color:#fff;line-height:1.2}
.blk .goal span small{display:block;font-size:13px;font-weight:400;color:rgba(255,255,255,.6)}
.blk .mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.blk .mini div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px}
.blk .mini b{display:block;font-size:24px;color:#A0F000}
.blk .mini small{font-size:12px;color:rgba(255,255,255,.65)}
.blk .clk{font-variant-numeric:tabular-nums}
.cd{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:0;padding:0;overflow:hidden}
.cd>div{padding:18px 20px;border-left:1px solid var(--line)}
.cd>div:first-child{border-left:0;background:linear-gradient(135deg,#004D39,#007A5A);color:#fff}
.cd .lbl2{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--mut)}
.cd>div:first-child .lbl2{color:rgba(255,255,255,.7)}
.cd .tm{display:flex;gap:8px;margin-top:8px}
.cd .tm span{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 8px;text-align:center;min-width:52px}
.cd .tm b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.cd .tm small{font-size:10.5px;opacity:.7;text-transform:uppercase;letter-spacing:.06em}
.cd .vv{font-size:32px;font-weight:700;color:var(--g9);margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums}
.cd .ss{font-size:12px;color:var(--mut)}
.refu-hot{border:2px solid #C8972B;background:linear-gradient(135deg,#FFF9EC,#fff)}
@media(max-width:1000px){.blk .in{grid-template-columns:1fr}.blk .r{border-left:0;border-top:1px solid rgba(255,255,255,.1)}.cd{grid-template-columns:1fr 1fr}.cd>div:first-child{grid-column:1/-1}.cd>div{border-top:1px solid var(--line)}}
@media(max-width:640px){.blk h2{font-size:26px}.blk .goal b{font-size:60px}.cd .tm span{min-width:44px}.cd .tm b{font-size:20px}}
.g16{grid-template-columns:1fr 1.6fr}@media(max-width:1000px){.g16{grid-template-columns:1fr}}
.qt{width:100%;border-collapse:separate;border-spacing:0}
.qt th,.qt td{padding:7px 8px;font-size:13px;border-bottom:1px solid var(--line);text-align:center}
.qt th:first-child,.qt td:first-child{text-align:left;color:var(--mut);font-weight:700;font-size:12px}
.qt thead th{background:var(--bg);font-size:11px}
.qt thead th.cur{background:var(--g1);color:var(--g7)}
.qt td b{font-weight:700}
.qbtn{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.qbtn button{border:0;background:none;font:inherit;font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:8px;color:var(--mut);cursor:pointer}
.qbtn button.on{background:#fff;color:var(--g7);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--g7);padding:12px 0 2px}
footer{max-width:1280px;margin:0 auto;padding:0 32px 32px;color:var(--mut);font-size:12px}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g21,.g12,.hero{grid-template-columns:1fr}}
@media(max-width:640px){header{padding:20px 16px 0}main{padding:18px 16px 40px}.g4,.g2{grid-template-columns:1fr}.big{font-size:42px}.rk{grid-template-columns:18px 76px 1fr 70px;gap:8px}.hero .side{grid-template-columns:1fr 1fr}}

/* Meta 2ª quinzena */
.q2h{background:radial-gradient(600px 260px at 100% 0,rgba(160,240,0,.22),transparent 60%),linear-gradient(125deg,#00301F,#004D39 45%,#007A5A);color:#fff;border:0;padding:0;overflow:hidden;display:grid;grid-template-columns:1.35fr 1fr}
.q2h .l{padding:28px 30px}
.q2h .kick{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--lime)}
.q2h .kick i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(160,240,0,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(160,240,0,0)}100%{box-shadow:0 0 0 0 rgba(160,240,0,0)}}
.q2h h2{font-size:40px;line-height:1.05;margin-top:10px;font-weight:700}
.q2h h2 b{color:var(--lime);font-size:64px;display:inline-block;margin-right:6px;vertical-align:-6px}
.q2h p{opacity:.82;margin-top:8px;font-size:14px;max-width:520px}
.dpills{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.dpill{width:62px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);text-align:center;padding:8px 0}
.dpill small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.dpill b{font-size:22px}
.dpill.next{background:var(--lime);color:#14231E;border-color:var(--lime)}
.q2h .r{background:rgba(0,0,0,.18);padding:26px 28px;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:center}
.q2h .r b{display:block;font-size:34px;line-height:1.05}
.q2h .r span{font-size:12px;opacity:.78}
.q2h .r .hl b{color:var(--lime)}
.q2bar{grid-column:1/-1;height:12px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
.q2bar i{display:block;height:100%;background:linear-gradient(90deg,#5EE0A8,var(--lime));border-radius:999px}
.q2g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.q2c{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;position:relative;overflow:hidden}

const pad=n=>String(n).padStart(2,'0');
function hoje(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const FIM=new Date(2026,10,30,23,59,59);
const HOL=['2026-11-02','2026-11-20'];
function util(d){const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());return d.getDay()>0&&d.getDay()<6&&!HOL.includes(k)}
function calc(){
  const now=new Date(), ms=Math.max(0,FIM-now);
  let du=0,hx=0;
  for(let d=new Date(now.getFullYear(),now.getMonth(),now.getDate());d<=FIM;d.setDate(d.getDate()+1)){
    if(!util(d))continue;
    const a=new Date(d);a.setHours(8,0,0,0);const b=new Date(d);b.setHours(18,0,0,0);
    const ini=now>a?now:a; if(b>ini){du++;hx+=(b-ini)/36e5}
  }
  const fimDia=new Date(now);fimDia.setHours(18,0,0,0);
  return {ms,dias:Math.floor(ms/864e5),h:Math.floor(ms/36e5)%24,m:Math.floor(ms/6e4)%60,s:Math.floor(ms/1e3)%60,
    corr:Math.ceil(ms/864e5),du,hx,hTot:Math.floor(ms/36e5),dia:Math.max(0,fimDia-now)};
}

    <div class="card"><h2>Origem das vendas</h2><p class="lead">Participação do time no total da unidade</p>
      <div style="display:flex;justify-content:center;margin-top:14px">${donut(D.team_v,outros)}</div>
      <div class="legend" style="justify-content:center"><span><i style="background:#007A5A"></i>Time: ${D.team_v}</span><span><i style="background:#BFE6D7"></i>Outros canais: ${outros}</span></div>
      <p class="note">Outros canais: site, WhatsApp, CSC, B2B2C e demais promotores.</p></div>
  </div>

  <div class="grid g16 mt">
    <div class="card"><h2>Pontos de atenção</h2><p class="lead">Indicadores da ${QL} fora da referência${QA==='q2'?' (parcial)':''}</p>
      <div style="max-height:560px;overflow-y:auto;padding-right:4px">${al.map(([l,t,s])=>`<div class="alert"><span class="bdg" style="background:${COL[l]}"></span><div><b>${esc(t)}</b><span>${s}</span></div></div>`).join('')||'<p class="note">Nenhum alerta.</p>'}</div></div>

  <div class="card" id="mapa">${mapa(QA)}</div>
  </div>`;
}

function vVend(){
  return `<div class="grid g3">${[...S].sort((a,b)=>b.mes.v-a.mes.v).map(s=>{const q=s[QA],cb=cbInfo(s),pb=Math.min(100,s.mes.v/s.alvo*100);
    const amb=s.pend.filter(p=>p.k==='AMBOS').length;
    return `<div class="card sc" style="--sc:${s.c}">
      <div class="hd"><div class="avs"><span class="av" style="background:${s.c};box-shadow:none">${ini(s.nome)}</span><div><h3>${esc(s.nome)}${s.ferias?' <span class="tag t-neu" style="vertical-align:2px">🏖️ De férias</span>':''}</h3><div class="sub">${esc(s.completo)}</div></div></div></div>
      <table class="qt"><thead><tr><th></th><th class="${QA==='q1'?'cur':''}">1ª quinzena</th><th class="${QA==='q2'?'cur':''}">2ª quinzena${QA==='q2'?' (parcial)':''}</th></tr></thead><tbody>
        ${[['Vendas','v'],['APP','app',75],['PL','pl',50],['QYC','qyc',D.meta_qyc],['Homologação','hom',D.meta_hom]].map(([lb,k,r])=>`<tr><td>${lb}</td>${['q1','q2'].map(qk=>{const v=s[qk][k];
          return k==='v'?`<td><b>${v==null?'-':v}</b></td>`:`<td><b class="${v==null?'':lv(v,r)}">${pct(v)}</b></td>`}).join('')}</tr>`).join('')}
        <tr><td>Elegível</td>${['q1','q2'].map(qk=>{const x=s[qk];return `<td>${x.v==null?'<span class="tag t-neu">Entrou 16/11</span>':x.eleg==null?'<span class="tag t-neu">Sem vendas</span>':`<span class="tag t-${x.eleg?'ok':'bad'}">${x.eleg?'Sim':'Não'}</span>`}</td>`}).join('')}</tr>
      </tbody></table>
      <div class="kv">
        <div><small>Vendas no mês</small><b>${s.mes.v}</b></div>
        <div><small>Projeção</small><b class="${s.proj>=100?'ok':''}">${s.proj}</b></div>
        <div><small>Homologação no mês</small><b class="${lv(s.mes.hom,98)}">${pct(s.mes.hom)}</b></div>
        <div><small>Cashback</small><b style="font-size:14px" class="${cb.cls==='neu'?'':cb.cls}">${cb.txt}</b></div>
      </div>
      <div><div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="lbl">Rumo às ${s.alvo} vendas</span><span><b>${s.mes.v}</b>/${s.alvo} · faltam ${falta(s)}</span></div>
        <div class="minibar"><i style="width:${pb}%;background:${s.c}"></i></div>
        <div class="sub" style="margin-top:6px">Ritmo necessário: ${fmt(falta(s)/meusDu(s),1)} vendas por dia útil${s.alvo<100?' · meta proporcional (entrada 16/11)':''}</div></div>
      <div class="sub">Carteira pendente: <b style="color:#14231E">${s.pend.length} clientes</b>${amb?`, ${amb} sem APP e sem PL`:''}</div>
    </div>`}).join('')}</div>
    <p class="note">1ª quinzena: 01 a 15/11 (fechada). 2ª quinzena: 16 a ${D.last}/11 (parcial). Cashback: o relatório mensal só informa faixas (R$ 0,00, abaixo de R$ 3,00 ou R$ 3,00 ou mais), então não é possível confirmar o mínimo de R$ 5,00 por quinzena.</p>`;
}

function vCart(){
  const tot=S.reduce((a,s)=>a+s.pend.length,0);
  const lab={AMBOS:['d-a','APP e PL'],APP:['d-b','Só APP'],PL:['d-c','Só PL']};
  return `<div class="card"><h2>Carteira pendente · ${tot} clientes</h2><p class="lead">Clientes do mês sem aplicativo e/ou sem PL ativa, por vendedor. Prioridade de cima para baixo.</p>
    <div class="legend"><span><span class="dot d-a"></span>APP e PL pendentes (prioridade máxima)</span><span><span class="dot d-b"></span>Só APP pendente</span><span><span class="dot d-c"></span>Só PL pendente</span></div></div>
  ${[...S].sort((a,b)=>b.pend.length-a.pend.length).map((s,i)=>{const c=k=>s.pend.filter(p=>p.k===k).length;
   return `<details class="cp" ${i===0?'open':''}><summary><h3>${esc(s.nome)} <span style="color:#62716B;font-weight:400;font-size:13px">· ${s.pend.length} clientes</span></h3>
     <span style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag t-bad">${c('AMBOS')} APP e PL</span><span class="tag t-warn">${c('APP')} só APP</span><span class="tag t-neu">${c('PL')} só PL</span></span></summary>
     <div class="cpw">${s.pend.length?[['q2','2ª quinzena (16 a '+D.last+'/11)'],['q1','1ª quinzena (01 a 15/11)']].map(([qk,ql])=>{const L=s.pend.filter(p=>(+p.d.slice(0,2)<=15)===(qk==='q1'));
       return L.length?`<div class="qh">${ql} · ${L.length} clientes</div><table><thead><tr><th>Cliente</th><th>Venda</th><th>Telefone</th><th>Pendência</th><th style="text-align:right">QYC</th></tr></thead><tbody>
     ${L.map(p=>`<tr><td>${esc(p.n)}</td><td>${p.d}</td><td style="white-space:nowrap">${p.t}</td><td style="white-space:nowrap"><span class="dot ${lab[p.k][0]}"></span>${lab[p.k][1]}</td><td style="text-align:right" class="${lv(p.q,75)}"><b>${p.q}%</b></td></tr>`).join('')}
     </tbody></table>`:''}).join(''):'<p class="note">Nenhum cliente pendente.</p>'}</div></details>`}).join('')}`;
}

function vComp(){
  const d=(a,b,suf='%')=>a==null||b==null?'<span class="tag t-neu">-</span>':`<span class="delta ${b-a>=0?'ok':'bad'}">${b-a>=0?'+':''}${fmt(b-a,1)}${suf}</span>`;
  const cell=v=>v==null?'<span style="color:#9AA8A2">-</span>':pct(v);
  return `<div class="card"><h2>Comparativo 1ª x 2ª quinzena</h2><p class="lead">1ª quinzena fechada (01 a 15/11). 2ª quinzena parcial, de 16 a ${D.last}/11. Mathias, Pedro Henrique e Keisy entraram em 16/11 e aparecem só na Q2.</p>
  <div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Vendedor</th><th>Vendas Q1</th><th>Vendas Q2</th><th>APP Q1</th><th>APP Q2</th><th>Δ</th><th>PL Q1</th><th>PL Q2</th><th>Δ</th><th>QYC Q1</th><th>QYC Q2</th><th>Δ</th><th>Total mês</th></tr></thead><tbody>
  ${[...S].sort((a,b)=>b.mes.v-a.mes.v).map(s=>`<tr><td><b>${esc(s.nome)}</b></td><td>${s.q1.v==null?'<span style="color:#9AA8A2">-</span>':s.q1.v}</td><td>${s.q2.v||'<span style="color:#9AA8A2">-</span>'}</td>
   <td>${cell(s.q1.app)}</td><td>${cell(s.q2.app)}</td><td>${d(s.q1.app,s.q2.app)}</td>
   <td>${cell(s.q1.pl)}</td><td>${cell(s.q2.pl)}</td><td>${d(s.q1.pl,s.q2.pl)}</td>
   <td>${cell(s.q1.qyc)}</td><td>${cell(s.q2.qyc)}</td><td>${d(s.q1.qyc,s.q2.qyc)}</td><td><b>${s.mes.v}</b></td></tr>`).join('')}
  <tr style="background:#F3F6F5"><td><b>Time</b></td><td><b>${S.reduce((a,s)=>a+(s.q1.v||0),0)}</b></td><td>${S.reduce((a,s)=>a+s.q2.v,0)||'-'}</td><td colspan="9"></td><td><b>${D.team_v}</b></td></tr>
  </tbody></table></div></div>`;
}

document.getElementById('stamp').innerHTML=`<span class="chip">Dados até <b>${D.atualizado}</b></span><span class="chip">${QL} em andamento</span><span class="chip">${D.du_pass} de ${D.du} dias úteis</span>`;
document.getElementById('v-geral').innerHTML=vGeral();
document.getElementById('v-q2').innerHTML=metaQ2();
document.getElementById('v-corr').innerHTML=race(true);
document.getElementById('v-vend').innerHTML=vVend();
document.getElementById('v-cart').innerHTML=vCart();
document.getElementById('v-comp').innerHTML=vComp();
document.getElementById('foot').innerHTML=`Fontes: Vendas realizadas (indicadores individuais), Produtividade por vendedor (total da unidade) e Cashback gerado (competência 2026/11). Dias úteis de novembro: 19 (sem 02/11 e 20/11). Meta da unidade: ${fmt(D.meta_unid)} vendas. Vendedores que entraram em 16/11 têm meta de bonificação proporcional aos dias úteis. TIM Controle: meta individual de 2 vendas por vendedor. Refuturiza em aberto, em checagem com o suporte. Gerado em ${D.gerado}.`;
tick();setInterval(tick,1000);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
